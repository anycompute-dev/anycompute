name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  logic-tests:
    name: Logic tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.18"
      - run: uv sync --locked --python "${{ matrix.python }}" ${{ matrix.python == '3.12' && '--extra modal --extra daytona' || '' }}
      - run: uv run --locked --no-sync pytest

  docker:
    name: Docker conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANYCOMPUTE_CONFORMANCE_PROVIDER: docker
      ANYCOMPUTE_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.18"
      - run: uv sync --locked --python 3.12 --extra docker
      - name: Pull the pinned Docker image
        shell: bash
        run: |
          image=$(uv run --locked python -c 'from anycompute.providers.docker import DEFAULT_IMAGE; print(DEFAULT_IMAGE)')
          docker pull "$image"
      - name: Run Docker conformance
        id: suite
        env:
          ANYCOMPUTE_REPORT_SOURCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'project-run' || 'user-run' }}
          ANYCOMPUTE_CONFORMANCE_REPORT: ${{ runner.temp }}/conformance-report.json
        run: uv run --locked pytest -q -m live_conformance tests/conformance
      - name: Upload the conformance report
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-docker-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance-report.json
          if-no-files-found: ${{ steps.suite.outcome == 'success' && 'error' || 'ignore' }}
