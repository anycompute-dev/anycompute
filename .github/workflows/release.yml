name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.dist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the release version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          if os.environ["GITHUB_REF"] != f"refs/tags/v{version}":
              raise SystemExit("Release tag must equal v followed by the package version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.18"
          enable-cache: false
      - run: uv build --no-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: dist
        with:
          name: release-distributions-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  smoke:
    name: Smoke-test the published package
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the published package
        shell: bash
        run: |
          if ! python -m venv "$RUNNER_TEMP/release-venv" ||
             ! timeout --kill-after=5s 600s bash -e -c '
               until "$RUNNER_TEMP/release-venv/bin/python" -m pip --isolated install \
                 --disable-pip-version-check --no-input --no-cache-dir \
                 --only-binary=anycompute \
                 --index-url https://pypi.org/simple "anycompute[docker]==$RELEASE_VERSION"; do
                 sleep 20
               done
             '; then
            echo "::error title=install failed::Could not install the published package"
            exit 1
          fi
      - name: Check providers and run the Docker smoke job
        shell: bash
        run: '"$RUNNER_TEMP/release-venv/bin/python" tests/release_smoke.py'
