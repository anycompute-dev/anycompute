name: Modal account check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.18"
          enable-cache: false
      - run: uv sync --locked --python 3.12 --extra modal
      - name: Verify the workspace and named image
        timeout-minutes: 2
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --locked --no-sync python -m tests.conformance.modal_account
